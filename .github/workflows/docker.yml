name: Docker image

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.aio
          platforms: linux/amd64
          build-args: |
            WITH_CLAP=1
            WITH_DEMUCS=1
            SITE_URL=https://subwave.vkugler.ch
            SUBWAVE_BUILD_VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/gatzenga/subwave:latest
            ghcr.io/gatzenga/subwave:${{ github.sha }}
