services:
  subwave:
    image: subwave:latest
    pull_policy: never
    container_name: sub-wave
    restart: unless-stopped
    mem_limit: 16g
    environment:
      - TZ=Europe/Zurich
      - ADMIN_USER=admin
      - ADMIN_PASS=7D76mmHNJkFKDnhR
      - SITE_URL=https://subwave.vkugler.ch
      - ANALYZE_REQUEST_TIMEOUT_MS=600000
      # Run the station as your own account instead of root. Set both or
      # neither — either missing and the container runs as root exactly as it
      # always did. Give the state folder to that user once (owner + write, in
      # your NAS's file manager); the container never changes ownership or
      # modes itself. See PUID.md.
      # - PUID=1001
      # - PGID=1001
    volumes:
      - /volume2/docker/subwave/state:/var/sub-wave
    ports:
      # Caddy listens on 8080 inside: a port below 1024 needs root, and the
      # station can run as an ordinary user.
      - "127.0.0.1:7700:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      navidrome:
        ipv4_address: 172.168.22.100

networks:
  navidrome:
    external: true
